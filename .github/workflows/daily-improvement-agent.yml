name: Daily Improvement Agent

on:
  schedule:
    # Runs every day at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  improve-project:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Daily Improvement Agent
        id: improve
        run: node .github/scripts/improvement-agent.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Create Pull Request for Improvements
        if: steps.improve.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            🤖 Daily improvements by Improvement Agent
            
            ${{ steps.improve.outputs.improvement_summary }}
          branch: daily-improvements/${{ steps.improve.outputs.date }}
          delete-branch: true
          title: '🤖 Daily Improvements - ${{ steps.improve.outputs.date }}'
          body: |
            ## 🤖 Automated Daily Improvements
            
            This PR contains automated improvements generated by the Daily Improvement Agent.
            
            ### Summary
            ${{ steps.improve.outputs.improvement_summary }}
            
            ### Changes Made
            ${{ steps.improve.outputs.changes_detail }}
            
            ### Review Checklist
            - [ ] Review code changes
            - [ ] Verify tests pass
            - [ ] Check for breaking changes
            
            ---
            *Generated by Daily Improvement Agent on ${{ steps.improve.outputs.date }}*
          labels: |
            automated
            improvement
            daily-agent

      - name: Create Issue for Manual Review Items
        if: steps.improve.outputs.has_manual_items == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const manualItems = process.env.MANUAL_ITEMS;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔍 Manual Review Required - Daily Agent Findings',
              body: `## Manual Review Items\n\n${manualItems}\n\n---\n*Generated by Daily Improvement Agent*`,
              labels: ['needs-review', 'daily-agent']
            });
        env:
          MANUAL_ITEMS: ${{ steps.improve.outputs.manual_items }}
